<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)" fill="#fff" transform="rotate(45 512 512)">
    <!-- head -->
    <path d="M512 150 Q 600 300 512 440 Q 424 300 512 150 Z"/>
    <!-- crossguard -->
    <rect x="444" y="430" width="136" height="34" rx="17"/>
    <!-- shaft -->
    <rect x="492" y="440" width="40" height="400" rx="20"/>
  </g>
</svg>
