<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Gungnir</title>
    <style>
      :root {
        --text: #333333; --text-secondary: #666666; --text-light: #b3b3b3;
        --border: #ebebeb; --border-strong: #d6d6d6; --bg: #ffffff; --bg-tertiary: #f1f1f1;
        --accent: #3e63dd; --accent-hover: #3358d4; --accent-soft: #edf2fe; --focus: #5e8af7;
        --danger: #e5484d; --danger-bg: #feebec; --brand: #c2410c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text);
        background: #f8f8f8; display: grid; place-items: center; -webkit-font-smoothing: antialiased;
      }
      main { width: 420px; max-width: calc(100vw - 32px); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 28px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06); }
      .logo { width: 40px; height: 40px; border-radius: 9px; background: linear-gradient(160deg, #ea580c, var(--brand)); display: grid; place-items: center; margin-bottom: 16px; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p { margin: 0 0 16px; color: var(--text-secondary); }
      label { display: block; font-weight: 500; margin-bottom: 6px; }
      input { width: 100%; height: 32px; padding: 0 8px; font: inherit; border-radius: 4px; border: 1px solid var(--border-strong); outline: none; }
      input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft); }
      .row { display: flex; gap: 8px; margin-top: 16px; }
      button { height: 32px; padding: 0 12px; font: inherit; font-weight: 500; border-radius: 4px; cursor: pointer; }
      .primary { background: var(--accent); color: #fff; border: none; }
      .primary:hover { background: var(--accent-hover); }
      .secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border-strong); }
      .secondary:hover { background: var(--bg-tertiary); }
      button:disabled { opacity: 0.5; cursor: default; }
      .error { background: var(--danger-bg); color: #b4232a; border-radius: 4px; padding: 8px 10px; margin-bottom: 16px; }
      .hint { color: var(--text-light); font-size: 12px; margin-top: 16px; margin-bottom: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="160 160 704 704"><g fill="#fff" transform="rotate(45 512 512)"><path d="M512 150 Q 600 300 512 440 Q 424 300 512 150 Z"/><rect x="444" y="430" width="136" height="34" rx="17"/><rect x="492" y="440" width="40" height="400" rx="20"/></g></svg>
      </div>
      <h1>Connect to Gungnir</h1>
      <p>Enter the address of your team’s Gungnir server, for example <b>gungnir.onrender.com</b>.</p>
      <div id="error" class="error" role="alert" hidden></div>
      <form id="form">
        <label for="server">Server address</label>
        <input id="server" name="server" type="text" autocomplete="url" spellcheck="false" placeholder="gungnir.onrender.com" required autofocus />
        <div class="row">
          <button id="connect" class="primary" type="submit">Connect</button>
          <button id="retry" class="secondary" type="button" hidden>Try again</button>
        </div>
      </form>
      <p class="hint">The address is saved on this Mac. To change it later, choose File › Change Server…</p>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
